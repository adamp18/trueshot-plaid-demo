name: Deploy True Shot demo

on:
  push:
    branches:
      - main
    paths:
      - site/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-swa-dmp-trueshot-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # v1 branch tip (2024-09-11). The v1 tag is an older commit and is not used.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1  # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: ""
          output_location: ""
          skip_app_build: true
